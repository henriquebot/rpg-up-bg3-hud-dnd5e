name: RPG Up Fork Release

on:
  workflow_dispatch:
  push:
    paths:
      - "module.json"
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read module metadata
        id: meta
        shell: bash
        run: |
          VERSION="$(jq -r '.version' module.json)"
          PACKAGE_ID="$(jq -r '.id' module.json)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "package_id=$PACKAGE_ID" >> "$GITHUB_OUTPUT"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Validate fork manifest
        shell: bash
        run: |
          test "$(jq -r '.id' module.json)" = "bg3-hud-dnd5e"
          test "$(jq -r '.relationships.systems[] | select(.id=="dnd5e") | .compatibility.maximum' module.json)" = "6.999.999"
          test "$(jq -r '.relationships.systems[] | select(.id=="dnd5e") | .compatibility.verified' module.json)" = "6.0.5"

      - name: Build module ZIP
        shell: bash
        run: |
          rm -f bg3-hud-dnd5e.zip
          zip -r bg3-hud-dnd5e.zip .             -x ".git/*"                ".github/*"                ".vscode/*"                "bg3-hud-dnd5e.zip"

      - name: Create or update tag
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git ls-remote --exit-code --tags origin "refs/tags/$VERSION" >/dev/null 2>&1; then
            echo "Tag $VERSION already exists; reusing it."
          else
            git tag "$VERSION"
            git push origin "$VERSION"
          fi

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.version }}
          name: RPG Up Fork ${{ steps.meta.outputs.version }}
          body: |
            RPG Up compatibility fork for D&D5e 6.x / Foundry VTT 14.
            Target tested manifest: D&D5e 6.0.5 and Foundry VTT 14.368.
          files: |
            bg3-hud-dnd5e.zip
            module.json
          make_latest: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
